name: Build binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --onefile --windowed --name xarchive-gui
          --collect-all gallery_dl
          --add-data "src/xarchive/templates;xarchive/templates"
          --paths src
          packaging/run_gui.py

      - name: Build GUI (Linux / macOS)
        if: runner.os != 'Windows'
        run: >-
          pyinstaller --onefile --windowed --name xarchive-gui
          --collect-all gallery_dl
          --add-data "src/xarchive/templates:xarchive/templates"
          --paths src
          packaging/run_gui.py

      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --onefile --name xarchive
          --collect-all gallery_dl
          --add-data "src/xarchive/templates;xarchive/templates"
          --paths src
          packaging/run_cli.py

      - name: Build CLI (Linux / macOS)
        if: runner.os != 'Windows'
        run: >-
          pyinstaller --onefile --name xarchive
          --collect-all gallery_dl
          --add-data "src/xarchive/templates:xarchive/templates"
          --paths src
          packaging/run_cli.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a "../xarchive-gui-${{ matrix.name }}.zip" xarchive-gui.exe
          7z a "../xarchive-cli-${{ matrix.name }}.zip" xarchive.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent --sequesterRsrc xarchive-gui.app "../xarchive-gui-${{ matrix.name }}.zip"
          tar -czf "../xarchive-cli-${{ matrix.name }}.tar.gz" xarchive

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "../xarchive-gui-${{ matrix.name }}.tar.gz" xarchive-gui
          tar -czf "../xarchive-cli-${{ matrix.name }}.tar.gz" xarchive

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: xarchive-gui-${{ matrix.name }}
          path: xarchive-gui-${{ matrix.name }}.*
          if-no-files-found: error

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: xarchive-cli-${{ matrix.name }}
          path: xarchive-cli-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: xarchive ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
