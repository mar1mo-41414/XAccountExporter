[project]
name = "xarchive"
version = "0.1.4"
description = "X(Twitter)の指定アカウントの投稿を全件保存し、オフライン閲覧用HTMLビューアを生成するツール"
requires-python = ">=3.12"
dependencies = [
    "gallery-dl>=1.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
xarchive = "xarchive.cli:main"

[project.gui-scripts]
xarchive-gui = "xarchive.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xarchive"]
